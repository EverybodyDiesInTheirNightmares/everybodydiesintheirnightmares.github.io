<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guestbook</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <style>
    body, .container, .giscus, .giscus-frame {
      font-family: KingHwa_OldSong, sans-serif;
    }
    body {
      line-height: 1.6;
      background-color: #FFFFFF;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .giscus {
      width: 100%;
      margin: 20px 0;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #fff;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #2f2f2f;
        color: #FFFFFF;
      }
      .container {
        background-color: #2f2f2f;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      }
      .giscus {
        border: 1px solid #555;
        background-color: #2f2f2f;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      }
    }
    @media (max-width: 600px) {
      .container {
        padding: 10px;
        margin: 20px auto;
      }
      .giscus {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <p>留言提交者不会收到邮件通知，如需进一步交流请持续关注或尝试邮件。</p>
    <div class="giscus">
      <script src="https://giscus.app/client.js"
        data-repo="EverybodyDiesInTheirNightmares/giscus_"
        data-repo-id="R_kgDOSHtvTQ"
        data-category="Announcements"
        data-category-id="DIC_kwDOSHtvTc4C7SAw"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
      </script>
    </div>
  </div>
</body>
</html>

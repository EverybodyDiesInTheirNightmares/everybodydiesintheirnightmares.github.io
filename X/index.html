                game: "游",
                tv: "剧",
                works: "玩"
            };
            this.baseAPI = config.baseAPI;
            this.type = "works";
            this.status = "complete";
            this.finished = false;
            this.paged = 1;
            this.subjects = [];
            this.musicData = null;
            this._create();
        }

        // Get all container elements (both original and kindle copies)
        _getAllContainers() {
            return document.querySelectorAll(this.containerSelector);
        }

        // Apply function to all containers
        _applyToAll(fn) {
            this._getAllContainers().forEach(fn);
        }

        // Query within all containers
        _queryAll(selector) {
            return document.querySelectorAll(selector);
        }

        on(event, element, callback) {
            const nodeList = document.querySelectorAll(element);
            nodeList.forEach((item) => {
                item.addEventListener(event, callback);
            });
        }

        _handleTypeClick() {
            this.on("click", ".neodb-navItem", (t) => {
                const self = t.currentTarget;
                this.type = self.dataset.type;
                // 行内版介绍只属于「玩」：切到其他标签时移除
                if (this.type !== "works") {
                    document.querySelectorAll(".neodb-nav .works-intro--nav").forEach(el => el.remove());
                }
                document.querySelectorAll(".neodb-navItem").forEach(el => el.classList.remove("active"));
                self.classList.add("active");
                this._clearList();
                this._toggleLoading(true);
                this.paged = 1;
                this.finished = false;
                this.subjects = [];
                this._fetchData();
            });
        }

        _renderTypes() {
            this._applyToAll(container => {
                const nav = container.querySelector(".neodb-nav");
                if (nav) {
                    nav.innerHTML = this.types
                        .map((item) => {
                            const isActive = item === this.type ? ' active' : '';
                            return `<span class="neodb-navItem${isActive}" data-type="${item}"><span class="nav-text">${this.typeNames[item]}</span></span>`;
                        })
                        .join("");
                }
            });
            this._handleTypeClick();
        }

        _fetchData() {
            if (this.type === 'works') {
                return this._fetchWorksData();
            }

            if (this.type === 'music') {
                return this._fetchMusicData();
            }

            const params = new URLSearchParams({
                type: "complete",
                category: this.type,
                page: this.paged.toString(),
            });

            return fetch(this.baseAPI + "?" + params.toString())
                .then((response) => response.json())
                .then((data) => {
                    if (data.length) {
                        // 过滤重复项
                        data = data.filter(item => !this.subjects.some(existing => existing.item.id === item.item.id));

                        if (data.length) {
                            this.subjects = [...this.subjects, ...data];
                            this._renderListTemplate();
                        }

                        this._toggleLoading(false);
                    } else {
                        this.finished = true; // 没有更多数据
                        this._toggleLoading(false);
                    }
                });
        }

        _fetchMusicData() {
            // API 列表：优先 Meting 格式，备用网易云 API 格式
            const MUSIC_APIS = [
                { url: 'https://api.injahow.cn/meting/?type=playlist&id=5244529625', type: 'meting' },
                { url: 'https://zm.wwoyun.cn/playlist/detail?id=5244529625', type: 'netease' },
            ];

            const normalize = (data, type) => {
                if (type === 'meting' && Array.isArray(data)) {
                    return data.map(s => ({
                        name: s.name,
                        artist: s.artist || '',
                        id: s.url ? (s.url.match(/id=(\d+)/) || [])[1] : ''
                    }));
                }
                if (type === 'netease' && data.playlist && data.playlist.tracks) {
                    return data.playlist.tracks.map(s => ({
                        name: s.name,
                        artist: (s.ar || []).map(a => a.name).join('/'),
                        id: String(s.id)
                    }));
                }
                return null;
            };

            const tryFetch = (index) => {
                if (index >= MUSIC_APIS.length) {
                    this.finished = true;
                    this._toggleLoading(false);
                    this._applyToAll(container => {
                        const list = container.querySelector(".neodb-list");
                        if (list) list.innerHTML = '<div class="neodb-loading">加载失败，请稍后再试</div>';
                    });
                    return;
                }
                const api = MUSIC_APIS[index];
                fetch(api.url)
                    .then(r => r.json())
                    .then(data => {
                        const songs = normalize(data, api.type);
                        if (songs && songs.length) {
                            this.musicData = songs;
                            this.finished = true;
                            this._renderMusicList(songs);
                            this._toggleLoading(false);
                        } else {
                            tryFetch(index + 1);
                        }
                    })
                    .catch(() => tryFetch(index + 1));
            };

            if (this.musicData) {
                this._renderMusicList(this.musicData);
                this._toggleLoading(false);
                return;
            }
            tryFetch(0);
        }

        _renderMusicList(data) {
            const html = data.map(song => {
                const link = song.id ? `https://music.163.com/#/song?id=${song.id}` : '#';
                const title = "《" + song.name + "》";
                const artist = song.artist || '';

                return `<div class="neodb-item">
                    <div class="neodb-title">
                        <a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(title)}</a>
                    </div>
                    <div class="neodb-comment">
                        ${artist ? `<p>${escapeHtml(artist)}</p>` : ""}
                    </div>
                </div>`;
            }).join("");

            this._applyToAll(container => {
                const list = container.querySelector(".neodb-list");
                if (list) list.innerHTML = html;
            });
        }

        _renderListTemplate() {
            // 标题优先取中文：NeoDB 的 title 字段是原始语言（外语片常为英文），
            // localized_title 数组里有各语言版本（注意字段名是 text 不是 title）
            const pickTitle = (it) => {
                if (Array.isArray(it.localized_title)) {
                    const zh = it.localized_title.find(t => (t.lang || '').toLowerCase() === 'zh-cn')
                        || it.localized_title.find(t => (t.lang || '').toLowerCase() === 'zh-hans')
                        || it.localized_title.find(t => (t.lang || '').toLowerCase() === 'zh')
                        || it.localized_title.find(t => (t.lang || '').toLowerCase().startsWith('zh'));
                    if (zh && zh.text) return zh.text;
                }
                return it.title || '';
            };
            const html = this.subjects
                .map((item) => {
                    const title = "《"+pickTitle(item.item)+"》";
                    const comment_text = item.comment_text;

                    return `<div class="neodb-item">
                        <div class="neodb-title">${escapeHtml(title)}</div>
                        <div class="neodb-comment">
                            ${comment_text ? `<p>${escapeHtml(comment_text)}</p>` : ""}
                        </div>
                    </div>`;
                })
                .join("");
            this._applyToAll(container => {
                const list = container.querySelector(".neodb-list");
                if (list) list.innerHTML = html;
            });
        }

        _getScrollContainers() {
            const containers = [window];
            const kindleScreen = document.getElementById("kindle-screen");
            if (kindleScreen) containers.push(kindleScreen);
            return containers;
        }

        _handleScroll() {
            let isLoading = false;

            const checkScroll = (scrollEl, isWindow) => {
                const moreElements = this._queryAll(".block-more");
                if (!moreElements.length || this.finished || isLoading) return;

                // 竖排页面沿横向滚动（阅读方向从右往左），用视口矩形判断是否触底
                const vertical = isWindow
                    ? getComputedStyle(document.body).writingMode.startsWith("vertical")
                    : getComputedStyle(scrollEl).writingMode.startsWith("vertical");

                let shouldLoad = false;
                moreElements.forEach(moreElement => {
                    if (moreElement.classList.contains("u-hide")) return;
                    const rect = moreElement.getBoundingClientRect();
                    if (isWindow) {
                        shouldLoad = vertical
                            ? rect.left <= window.innerWidth   // 加载指示器进入视口左缘
                            : rect.bottom <= window.innerHeight;
                    } else {
                        const sr = scrollEl.getBoundingClientRect();
                        shouldLoad = vertical
                            ? rect.left <= sr.right
                            : rect.bottom <= sr.bottom;
                    }
                });

                if (shouldLoad && this._isLoadingHidden()) {
                    isLoading = true;
                    this._toggleLoading(true);
                    this.paged++;
                    this._fetchData().finally(() => {
                        isLoading = false;
                    });
                }
            };

            this._getScrollContainers().forEach(sc => {
                if (sc === window) {
                    window.addEventListener("scroll", () => checkScroll(window, true));
                } else {
                    sc.addEventListener("scroll", () => checkScroll(sc, false));
                }
            });
        }

        // ========== 作品区（图 / 视频 / 音频） ==========
        _fetchWorksData() {
            if (this.worksData) {
                this._renderWorks(this.worksData);
                this._toggleLoading(false);
                return Promise.resolve();
            }
            return fetch('/X/works.json')
                .then(r => r.json())
                .then(data => {
                    this.worksData = Array.isArray(data) ? data : [];
                    this.finished = true; // 作品区一次性展示，无需无限加载
                    this._toggleLoading(false);
                    this._renderWorks(this.worksData);
                })
                .catch(() => {
                    this.finished = true;
                    this._toggleLoading(false);
                    this._applyToAll(container => {
                        const list = container.querySelector(".neodb-list");
                        if (list) list.innerHTML = '<div class="neodb-loading">加载失败，请稍后再试</div>';
                    });
                });
        }

        _renderWorks(data) {
            const cells = [];
            const audioRows = [];
            data.forEach((item, i) => {
                if (item.type === 'audio') {
                    audioRows.push(this._workAudioHtml(item));
                } else {
                    cells.push(this._workCellHtml(item, i));
                }
            });
            const gridHtml = cells.length ? `<div class="works-grid">${cells.join("")}</div>` : "";
            const audioHtml = audioRows.length ? audioRows.join("") : "";
            const INTRO_TEXT = "放置一些自己制作的东西，可能是任何事物。";
            const intro = `<p class="works-intro works-intro--list">${INTRO_TEXT}</p>`;
            const finalHtml = intro + ((gridHtml + audioHtml) || '<div class="works-empty">还没有作品</div>');

            this._applyToAll(container => {
                const list = container.querySelector(".neodb-list");
                if (list) list.innerHTML = finalHtml;
                // 横排：介绍作为导航行的延续（紧跟「剧」之后）；竖排隐藏，由列表版接管
                const nav = container.querySelector(".neodb-nav");
                if (nav) {
                    nav.querySelectorAll(".works-intro--nav").forEach(el => el.remove());
                    nav.insertAdjacentHTML("beforeend",
                        `<span class="works-intro works-intro--nav">${INTRO_TEXT}</span>`);
                }
            });
            this._bindWorksEvents();
        }

        _workCellHtml(item, i) {
            const cap = item.title ? `<div class="work-caption">${escapeHtml(item.title)}</div>` : "";
            const idx = `data-index="${i}"`;
            if (item.type === 'video') {
                const poster = item.poster
                    ? `<img src="${escapeHtml(item.poster)}" alt="${escapeHtml(item.title || '')}" loading="lazy">`
                    : "";
                return `<div class="work-cell work-cell--video" ${idx} tabindex="0"><div class="work-media">${poster}<div class="work-play"></div></div>${cap}</div>`;
            }
            if (item.type === 'link') {
                const poster = item.poster
                    ? `<img src="${escapeHtml(item.poster)}" alt="${escapeHtml(item.title || '')}" loading="lazy">`
                    : "";
                return `<div class="work-cell work-cell--link" ${idx} tabindex="0"><div class="work-media">${poster}</div>${cap}</div>`;
            }
            if (item.type === 'sticker') {
                const poster = item.poster
                    ? `<img src="${escapeHtml(item.poster)}" alt="${escapeHtml(item.title || '')}" loading="lazy">`
                    : "";
                // 诗全文不超过 200 字则卡片直接全文展示，否则只预览前两句
                const poemLines = Array.isArray(item.poem) ? item.poem : [];
                const previewLines = poemLines.join("").length <= 200 ? poemLines : poemLines.slice(0, 2);
                const preview = previewLines
                    .map(l => `<span class="work-poem-preview-line">${escapeHtml(l)}</span>`)
                    .join("");
                return `<div class="work-cell work-cell--sticker" ${idx} tabindex="0"><div class="work-media">${poster}</div>${cap}${preview ? `<div class="work-poem-preview">${preview}</div>` : ""}</div>`;
            }
            return `<div class="work-cell" ${idx} tabindex="0"><div class="work-media"><img src="${escapeHtml(item.src || '')}" alt="${escapeHtml(item.title || '')}" loading="lazy"></div>${cap}</div>`;
        }

        _workAudioHtml(item) {
            const title = item.title ? escapeHtml(item.title) : "未命名";
            return `<div class="work-audio">
                <div class="work-audio-title">${title}</div>
                <audio controls preload="none" src="${escapeHtml(item.src || '')}"></audio>
            </div>`;
        }

        _bindWorksEvents() {
            if (this._worksBound) return;
            this._worksBound = true;
            document.addEventListener("click", (e) => {
                const cell = e.target.closest(".work-cell");
                if (!cell || cell.dataset.index === undefined) return;
                const item = (this.worksData || [])[Number(cell.dataset.index)];
                if (!item) return;
                if (item.type === 'link') {
                    if (item.src) window.open(item.src, '_blank', 'noopener');
                    return;
                }
                if (item.type === 'sticker') {
                    this._openPoem(item);
                    return;
                }
                if (item.type === 'video') {
                    this._openVideo(item);
                } else {
                    this._openLightbox(item);
                }
            });
        }

        // 视频灯箱：原生控件（播放/暂停、音量、进度、全屏等）
        _openVideo(item) {
            const overlay = document.createElement("div");
            overlay.className = "work-lightbox work-lightbox--video";
            overlay.innerHTML = `<video controls autoplay playsinline src="${escapeHtml(item.src || '')}" poster="${escapeHtml(item.poster || '')}"></video>
                ${item.title ? `<div class="work-lightbox-caption">${escapeHtml(item.title)}</div>` : ""}
                <button class="work-lightbox-close" type="button" aria-label="关闭">&times;</button>`;
            document.body.appendChild(overlay);

            const video = overlay.querySelector("video");
            const close = () => {
                document.removeEventListener("keydown", onKey);
                video.pause();
                overlay.remove();
            };
            const onKey = (e) => { if (e.key === "Escape") close(); };
            document.addEventListener("keydown", onKey);
            // 点空白处关闭；视频区域（含控件）上的点击不冒泡关闭
            overlay.addEventListener("click", (e) => {
                if (e.target === overlay) close();
            });
            overlay.querySelector(".work-lightbox-close").addEventListener("click", close);
        }

        // 诗笺：贴纸视频 + 逐行浮现的诗（浮现节奏逐行加快，呼应「转速升高」）
        _openPoem(item) {
            const raw = (item.title || "未命名").split("：");
            const author = raw.length > 1 ? raw[0] : "";
            const poemTitle = raw.length > 1 ? raw.slice(1).join("：") : raw[0];
            const lines = Array.isArray(item.poem) ? item.poem : [];

            const overlay = document.createElement("div");
            overlay.className = "work-poem";
            overlay.innerHTML = `
                <div class="work-poem-inner">
                    ${item.src ? `<video class="work-poem-video" src="${escapeHtml(item.src)}" poster="${escapeHtml(item.poster || '')}" autoplay loop muted playsinline></video>` : ""}
                    ${author ? `<div class="work-poem-author">${escapeHtml(author)}</div>` : ""}
                    <div class="work-poem-title">${escapeHtml(poemTitle)}</div>
                    ${lines.map(l => `<div class="work-poem-line">${escapeHtml(l)}</div>`).join("")}
                </div>
                <div class="work-lightbox-hint">点击空白处关闭</div>
                <button class="work-lightbox-close" type="button" aria-label="关闭">&times;</button>`;
            document.body.appendChild(overlay);

            // 浮现次序：作者/诗题最先（150ms），诗句按行加速（600ms 起，每行 ×0.8）
            setTimeout(() => {
                overlay.querySelectorAll(".work-poem-author, .work-poem-title")
                    .forEach(el => el.classList.add("show"));
            }, 150);
            overlay.querySelectorAll(".work-poem-line").forEach((el, i) => {
                setTimeout(() => el.classList.add("show"), 600 * Math.pow(0.8, i));
            });

            const close = () => {
                document.removeEventListener("keydown", onKey);
                overlay.remove();
            };
            const onKey = (e) => { if (e.key === "Escape") close(); };
            document.addEventListener("keydown", onKey);
            overlay.addEventListener("click", (e) => {
                if (e.target === overlay) close();
            });
            overlay.querySelector(".work-lightbox-close").addEventListener("click", close);
        }

        _openLightbox(item) {
            // 图集：所有以灯箱查看的图片（视频内联播放、外链跳转、贴纸开诗笺，均不入图集）
            const gallery = (this.worksData || []).filter(it =>
                it.type !== 'video' && it.type !== 'link' && it.type !== 'sticker' && it.type !== 'audio');
            let index = gallery.indexOf(item);

            const overlay = document.createElement("div");
            overlay.className = "work-lightbox";
            overlay.innerHTML = `<img loading="lazy" src="${escapeHtml(item.src || '')}" alt="${escapeHtml(item.title || '')}">
                <div class="work-lightbox-caption">${escapeHtml(item.title || '')}</div>
                <div class="work-lightbox-hint">滚轮切换 · 双击缩放 · Esc 或点空白处关闭</div>
                <button class="work-lightbox-close" type="button" aria-label="关闭">&times;</button>`;
            document.body.appendChild(overlay);

            const img = overlay.querySelector("img");
            const capEl = overlay.querySelector(".work-lightbox-caption");
            let scale = 1, tx = 0, ty = 0;
            const pointers = new Map(); // pointerId -> {x, y}
            let lastDist = 0;

            const clampScale = (s) => Math.min(8, Math.max(1, s));
            const clampPan = () => {
                const mx = (img.clientWidth * (scale - 1)) / 2;
                const my = (img.clientHeight * (scale - 1)) / 2;
                tx = Math.min(mx, Math.max(-mx, tx));
                ty = Math.min(my, Math.max(-my, ty));
            };
            const apply = () => {
                img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
                overlay.classList.toggle("work-lightbox--zoomed", scale > 1);
            };
            // 切换到图集中第 index 张：换图、换标题、复位缩放
            const show = (it) => {
                img.src = it.src || '';
                img.alt = it.title || '';
                capEl.textContent = it.title || '';
                scale = 1; tx = 0; ty = 0;
                apply();
            };
            // 以 (clientX, clientY) 为中心缩放，保持该点下的图像位置不动
            const zoomAt = (clientX, clientY, factor) => {
                const rect = img.getBoundingClientRect();
                tx += (clientX - (rect.left + rect.width / 2)) * (1 - factor);
                ty += (clientY - (rect.top + rect.height / 2)) * (1 - factor);
                scale = clampScale(scale * factor);
                if (scale === 1) { tx = 0; ty = 0; }
                clampPan();
                apply();
            };
            const close = () => {
                document.removeEventListener("keydown", onKey);
                overlay.remove();
            };
            const onKey = (e) => { if (e.key === "Escape") close(); };
            document.addEventListener("keydown", onKey);

            // 滚轮：切换前后一张（带节流，避免一次滚动连翻多张）
            let wheelLock = 0;
            overlay.addEventListener("wheel", (e) => {
                e.preventDefault();
                if (index < 0 || gallery.length < 2) return;
                const now = Date.now();
                if (now - wheelLock < 350) return;
                const next = e.deltaY < 0 ? index - 1 : index + 1;
                if (next < 0 || next >= gallery.length) return;
                wheelLock = now;
                index = next;
                show(gallery[index]);
            }, { passive: false });

            // 双击：放大 2.5x / 还原
            overlay.addEventListener("dblclick", (e) => {
                e.preventDefault();
                if (scale > 1) { scale = 1; tx = 0; ty = 0; apply(); }
                else zoomAt(e.clientX, e.clientY, 2.5);
            });

            // 指针事件：拖拽平移 + 双指捏合缩放
            overlay.addEventListener("pointerdown", (e) => {
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pointers.size === 2) {
                    const [a, b] = [...pointers.values()];
                    lastDist = Math.hypot(a.x - b.x, a.y - b.y);
                }
                // 仅按在图片上时捕获指针；空白处不捕获，
                // 否则 click 的 target 会变成 img，导致「点空白处关闭」失效
                if (e.target === img) img.setPointerCapture(e.pointerId);
            });
            overlay.addEventListener("pointermove", (e) => {
                const prev = pointers.get(e.pointerId);
                if (!prev) return;
                const cur = { x: e.clientX, y: e.clientY };
                pointers.set(e.pointerId, cur);
                if (pointers.size === 2) {
                    const [a, b] = [...pointers.values()];
                    const dist = Math.hypot(a.x - b.x, a.y - b.y);
                    if (lastDist > 0 && dist > 0) {
                        zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, dist / lastDist);
                    }
                    lastDist = dist;
                } else if (scale > 1) {
                    tx += cur.x - prev.x;
                    ty += cur.y - prev.y;
                    clampPan();
                    apply();
                }
            });
            const endPointer = (e) => {
                pointers.delete(e.pointerId);
                lastDist = 0;
            };
            overlay.addEventListener("pointerup", endPointer);
            overlay.addEventListener("pointercancel", endPointer);

            // 关闭：点空白处 / 右上角按钮 / Esc
            overlay.addEventListener("click", (e) => {
                if (e.target === overlay) close();
            });
            overlay.querySelector(".work-lightbox-close").addEventListener("click", close);
        }

        _create() {
            if (!document.querySelector(".neodb-container")) return;

            this._applyToAll(container => {
                container.innerHTML = `
                    <nav class="neodb-nav"></nav>
                    <div class="neodb-list"><div class="neodb-loading">加载中...</div></div>
                    <div class="block-more block-more__centered">
                        <div class="lds-ripple"></div>
                    </div>
                `;
            });
            this._renderTypes();
            this._fetchData();
            this._handleScroll();
        }

        _clearList() {
            this._applyToAll(container => {
                const list = container.querySelector(".neodb-list");
                if (list) list.innerHTML = '<div class="neodb-loading">加载中...</div>';
            });
        }

        _toggleLoading(show) {
            this._queryAll(".lds-ripple").forEach(el => {
                if (show) {
                    el.classList.remove("u-hide");
                } else {
                    el.classList.add("u-hide");
                }
            });
        }

        _isLoadingHidden() {
            const el = this._queryAll(".lds-ripple")[0];
            return el && el.classList.contains("u-hide");
        }
    }

    // Only init once (avoid double init from duplicated page content)
    let _neodbInitialized = false;
    document.addEventListener("DOMContentLoaded", () => {
        if (_neodbInitialized) return;
        _neodbInitialized = true;
        const neodb = new NeoDB({
            container: ".neodb-container",
            baseAPI: "https://x.numb.tech/api",
            types: ["works", "book", "movie", "music", "game", "tv"],
        });

        html:not([data-theme="light"]) .work-audio {
            border-bottom-color: #3a3a3a;
        }
        html:not([data-theme="light"]) .work-audio-title {
            color: #e5e5e5;
        }
        html:not([data-theme="light"]) .work-caption {
            color: rgba(255, 255, 255, 0.55);
        }
    }
</style>

<div class="neodb-container">
    <nav class="neodb-nav"></nav>
    <div class="neodb-list"><div class="neodb-loading">加载中...</div></div>
    <div class="block-more block-more__centered">
        <div class="lds-ripple"></div>
    </div>
</div>
<br><br>

<script>
    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    class NeoDB {
        constructor(config) {
            this.containerSelector = config.container;
            this.types = config.types ?? ["works", "book", "movie", "music", "game", "tv"];
            this.typeNames = {
                book: "书",
                movie: "影",
                music: "音",
                game: "游",
                tv: "剧",
                works: "玩"
            };
            this.baseAPI = config.baseAPI;
            this.type = "works";
            this.status = "complete";
            this.finished = false;
            this.paged = 1;
            this.subjects = [];
            this.musicData = null;
            this._create();
        }

        // Get all container elements (both original and kindle copies)
        _getAllContainers() {
            return document.querySelectorAll(this.containerSelector);
        }

        // Apply function to all containers
        _applyToAll(fn) {
            this._getAllContainers().forEach(fn);
        }

        // Query within all containers
        _queryAll(selector) {
            return document.querySelectorAll(selector);
        }

        on(event, element, callback) {
            const nodeList = document.querySelectorAll(element);
            nodeList.forEach((item) => {
                item.addEventListener(event, callback);
            });
        }

        _handleTypeClick() {
            this.on("click", ".neodb-navItem", (t) => {
                const self = t.currentTarget;
                this.type = self.dataset.type;
                // 行内版介绍只属于「玩」：切到其他标签时移除
                if (this.type !== "works") {
                    document.querySelectorAll(".neodb-nav .works-intro--nav").forEach(el => el.remove());
                }
                document.querySelectorAll(".neodb-navItem").forEach(el => el.classList.remove("active"));
                self.classList.add("active");
                this._clearList();
                this._toggleLoading(true);
                this.paged = 1;
                this.finished = false;
                this.subjects = [];
                this._fetchData();
            });
        }

        _renderTypes() {
            this._applyToAll(container => {
                const nav = container.querySelector(".neodb-nav");
                if (nav) {
                    nav.innerHTML = this.types
                        .map((item) => {
                            const isActive = item === this.type ? ' active' : '';
                            return `<span class="neodb-navItem${isActive}" data-type="${item}"><span class="nav-text">${this.typeNames[item]}</span></span>`;
                        })
                        .join("");
                }
            });
            this._handleTypeClick();
        }

        _fetchData() {
            if (this.type === 'works') {
                return this._fetchWorksData();
            }

            if (this.type === 'music') {
                return this._fetchMusicData();
            }

            const params = new URLSearchParams({
                type: "complete",
                category: this.type,
                page: this.paged.toString(),
            });

            return fetch(this.baseAPI + "?" + params.toString())
                .then((response) => response.json())
                .then((data) => {
                    if (data.length) {
                        // 过滤重复项
                        data = data.filter(item => !this.subjects.some(existing => existing.item.id === item.item.id));

                        if (data.length) {
                            this.subjects = [...this.subjects, ...data];
                            this._renderListTemplate();
                        }

                        this._toggleLoading(false);
                    } else {
                        this.finished = true; // 没有更多数据
                        this._toggleLoading(false);
                    }
                });
        }

        _fetchMusicData() {
            // API 列表：优先 Meting 格式，备用网易云 API 格式
            const MUSIC_APIS = [
                { url: 'https://api.injahow.cn/meting/?type=playlist&id=5244529625', type: 'meting' },
                { url: 'https://zm.wwoyun.cn/playlist/detail?id=5244529625', type: 'netease' },
            ];

            const normalize = (data, type) => {
                if (type === 'meting' && Array.isArray(data)) {
                    return data.map(s => ({
                        name: s.name,
                        artist: s.artist || '',
                        id: s.url ? (s.url.match(/id=(\d+)/) || [])[1] : ''
                    }));
                }
                if (type === 'netease' && data.playlist && data.playlist.tracks) {
                    return data.playlist.tracks.map(s => ({
                        name: s.name,
                        artist: (s.ar || []).map(a => a.name).join('/'),
                        id: String(s.id)
                    }));
                }
                return null;
            };

            const tryFetch = (index) => {
                if (index >= MUSIC_APIS.length) {
                    this.finished = true;
                    this._toggleLoading(false);
                    this._applyToAll(container => {
                        const list = container.querySelector(".neodb-list");
                        if (list) list.innerHTML = '<div class="neodb-loading">加载失败，请稍后再试</div>';
                    });
                    return;
                }
                const api = MUSIC_APIS[index];
                fetch(api.url)
                    .then(r => r.json())
                    .then(data => {
                        const songs = normalize(data, api.type);
                        if (songs && songs.length) {
                            this.musicData = songs;
                            this.finished = true;
                            this._renderMusicList(songs);
                            this._toggleLoading(false);
                        } else {
                            tryFetch(index + 1);
                        }
                    })
                    .catch(() => tryFetch(index + 1));
            };

            if (this.musicData) {
                this._renderMusicList(this.musicData);
                this._toggleLoading(false);
                return;
            }
            tryFetch(0);
        }

        _renderMusicList(data) {
            const html = data.map(song => {
                const link = song.id ? `https://music.163.com/#/song?id=${song.id}` : '#';
                const title = "《" + song.name + "》";
                const artist = song.artist || '';

                return `<div class="neodb-item">
                    <div class="neodb-title">
                        <a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(title)}</a>
                    </div>
                    <div class="neodb-comment">
                        ${artist ? `<p>${escapeHtml(artist)}</p>` : ""}
                    </div>
                </div>`;
            }).join("");

            this._applyToAll(container => {
                const list = container.querySelector(".neodb-list");
                if (list) list.innerHTML = html;
            });
        }

        _renderListTemplate() {
            // 标题优先取中文：NeoDB 的 title 字段是原始语言（外语片常为英文），
            // localized_title 数组里有各语言版本（注意字段名是 text 不是 title）
            const pickTitle = (it) => {
                if (Array.isArray(it.localized_title)) {
                    const zh = it.localized_title.find(t => (t.lang || '').toLowerCase() === 'zh-cn')
                        || it.localized_title.find(t => (t.lang || '').toLowerCase() === 'zh-hans')
                        || it.localized_title.find(t => (t.lang || '').toLowerCase() === 'zh')
                        || it.localized_title.find(t => (t.lang || '').toLowerCase().startsWith('zh'));
                    if (zh && zh.text) return zh.text;
                }
                return it.title || '';
            };
            const html = this.subjects
                .map((item) => {
                    const title = "《"+pickTitle(item.item)+"》";
                    const comment_text = item.comment_text;

                    return `<div class="neodb-item">
                        <div class="neodb-title">${escapeHtml(title)}</div>
                        <div class="neodb-comment">
                            ${comment_text ? `<p>${escapeHtml(comment_text)}</p>` : ""}
                        </div>
                    </div>`;
                })
                .join("");
            this._applyToAll(container => {
                const list = container.querySelector(".neodb-list");
                if (list) list.innerHTML = html;
            });
        }

        _getScrollContainers() {
            const containers = [window];
            const kindleScreen = document.getElementById("kindle-screen");
            if (kindleScreen) containers.push(kindleScreen);
            return containers;
        }

        _handleScroll() {
            let isLoading = false;

            const checkScroll = (scrollEl, isWindow) => {
                const moreElements = this._queryAll(".block-more");
                if (!moreElements.length || this.finished || isLoading) return;

                // 竖排页面沿横向滚动（阅读方向从右往左），用视口矩形判断是否触底
                const vertical = isWindow
                    ? getComputedStyle(document.body).writingMode.startsWith("vertical")
                    : getComputedStyle(scrollEl).writingMode.startsWith("vertical");

                let shouldLoad = false;
                moreElements.forEach(moreElement => {
                    if (moreElement.classList.contains("u-hide")) return;
                    const rect = moreElement.getBoundingClientRect();
                    if (isWindow) {
                        shouldLoad = vertical
                            ? rect.left <= window.innerWidth   // 加载指示器进入视口左缘
                            : rect.bottom <= window.innerHeight;
                    } else {
                        const sr = scrollEl.getBoundingClientRect();
                        shouldLoad = vertical
                            ? rect.left <= sr.right
                            : rect.bottom <= sr.bottom;
                    }
                });

                if (shouldLoad && this._isLoadingHidden()) {
                    isLoading = true;
                    this._toggleLoading(true);
                    this.paged++;
                    this._fetchData().finally(() => {
                        isLoading = false;
                    });
                }
            };

            this._getScrollContainers().forEach(sc => {
                if (sc === window) {
                    window.addEventListener("scroll", () => checkScroll(window, true));
                } else {
                    sc.addEventListener("scroll", () => checkScroll(sc, false));
                }
            });
        }

        // ========== 作品区（图 / 视频 / 音频） ==========
        _fetchWorksData() {
            if (this.worksData) {
                this._renderWorks(this.worksData);
                this._toggleLoading(false);
                return Promise.resolve();
            }
            return fetch('/X/works.json')
                .then(r => r.json())
                .then(data => {
                    this.worksData = Array.isArray(data) ? data : [];
                    this.finished = true; // 作品区一次性展示，无需无限加载
                    this._toggleLoading(false);
                    this._renderWorks(this.worksData);
                })
                .catch(() => {
                    this.finished = true;
                    this._toggleLoading(false);
                    this._applyToAll(container => {
                        const list = container.querySelector(".neodb-list");
                        if (list) list.innerHTML = '<div class="neodb-loading">加载失败，请稍后再试</div>';
                    });
                });
        }

        _renderWorks(data) {
            const cells = [];
            const audioRows = [];
            data.forEach((item, i) => {
                if (item.type === 'audio') {
                    audioRows.push(this._workAudioHtml(item));
                } else {
                    cells.push(this._workCellHtml(item, i));
                }
            });
            const gridHtml = cells.length ? `<div class="works-grid">${cells.join("")}</div>` : "";
            const audioHtml = audioRows.length ? audioRows.join("") : "";
            const INTRO_TEXT = "放置一些自己制作的东西，可能是任何事物。";
            const intro = `<p class="works-intro works-intro--list">${INTRO_TEXT}</p>`;
            const finalHtml = intro + ((gridHtml + audioHtml) || '<div class="works-empty">还没有作品</div>');

            this._applyToAll(container => {
                const list = container.querySelector(".neodb-list");
                if (list) list.innerHTML = finalHtml;
                // 横排：介绍作为导航行的延续（紧跟「剧」之后）；竖排隐藏，由列表版接管
                const nav = container.querySelector(".neodb-nav");
                if (nav) {
                    nav.querySelectorAll(".works-intro--nav").forEach(el => el.remove());
                    nav.insertAdjacentHTML("beforeend",
                        `<span class="works-intro works-intro--nav">${INTRO_TEXT}</span>`);
                }
            });
            this._bindWorksEvents();
        }

        _workCellHtml(item, i) {
            const cap = item.title ? `<div class="work-caption">${escapeHtml(item.title)}</div>` : "";
            const idx = `data-index="${i}"`;
            if (item.type === 'video') {
                const poster = item.poster
                    ? `<img src="${escapeHtml(item.poster)}" alt="${escapeHtml(item.title || '')}" loading="lazy">`
                    : "";
                return `<div class="work-cell work-cell--video" ${idx} tabindex="0"><div class="work-media">${poster}<div class="work-play"></div></div>${cap}</div>`;
            }
            if (item.type === 'link') {
                const poster = item.poster
                    ? `<img src="${escapeHtml(item.poster)}" alt="${escapeHtml(item.title || '')}" loading="lazy">`
                    : "";
                return `<div class="work-cell work-cell--link" ${idx} tabindex="0"><div class="work-media">${poster}</div>${cap}</div>`;
            }
            if (item.type === 'sticker') {
                const poster = item.poster
                    ? `<img src="${escapeHtml(item.poster)}" alt="${escapeHtml(item.title || '')}" loading="lazy">`
                    : "";
                // 诗全文不超过 200 字则卡片直接全文展示，否则只预览前两句
                const poemLines = Array.isArray(item.poem) ? item.poem : [];
                const previewLines = poemLines.join("").length <= 200 ? poemLines : poemLines.slice(0, 2);
                const preview = previewLines
                    .map(l => `<span class="work-poem-preview-line">${escapeHtml(l)}</span>`)
                    .join("");
                return `<div class="work-cell work-cell--sticker" ${idx} tabindex="0"><div class="work-media">${poster}</div>${cap}${preview ? `<div class="work-poem-preview">${preview}</div>` : ""}</div>`;
            }
            return `<div class="work-cell" ${idx} tabindex="0"><div class="work-media"><img src="${escapeHtml(item.src || '')}" alt="${escapeHtml(item.title || '')}" loading="lazy"></div>${cap}</div>`;
        }

        _workAudioHtml(item) {
            const title = item.title ? escapeHtml(item.title) : "未命名";
            return `<div class="work-audio">
                <div class="work-audio-title">${title}</div>
                <audio controls preload="none" src="${escapeHtml(item.src || '')}"></audio>
            </div>`;
        }

        _bindWorksEvents() {
            if (this._worksBound) return;
            this._worksBound = true;
            document.addEventListener("click", (e) => {
                const cell = e.target.closest(".work-cell");
                if (!cell || cell.dataset.index === undefined) return;
                const item = (this.worksData || [])[Number(cell.dataset.index)];
                if (!item) return;
                if (item.type === 'link') {
                    if (item.src) window.open(item.src, '_blank', 'noopener');
                    return;
                }
                if (item.type === 'sticker') {
                    this._openPoem(item);
                    return;
                }
                if (item.type === 'video') {
                    this._openVideo(item);
                } else {
                    this._openLightbox(item);
                }
            });
        }

        // 视频灯箱：原生控件（播放/暂停、音量、进度、全屏等）
        _openVideo(item) {
            const overlay = document.createElement("div");
            overlay.className = "work-lightbox work-lightbox--video";
            overlay.innerHTML = `<video controls autoplay playsinline src="${escapeHtml(item.src || '')}" poster="${escapeHtml(item.poster || '')}"></video>
                ${item.title ? `<div class="work-lightbox-caption">${escapeHtml(item.title)}</div>` : ""}
                <button class="work-lightbox-close" type="button" aria-label="关闭">&times;</button>`;
            document.body.appendChild(overlay);

            const video = overlay.querySelector("video");
            const close = () => {
                document.removeEventListener("keydown", onKey);
                video.pause();
                overlay.remove();
            };
            const onKey = (e) => { if (e.key === "Escape") close(); };
            document.addEventListener("keydown", onKey);
            // 点空白处关闭；视频区域（含控件）上的点击不冒泡关闭
            overlay.addEventListener("click", (e) => {
                if (e.target === overlay) close();
            });
            overlay.querySelector(".work-lightbox-close").addEventListener("click", close);
        }

        // 诗笺：贴纸视频 + 逐行浮现的诗（浮现节奏逐行加快，呼应「转速升高」）
        _openPoem(item) {
            const raw = (item.title || "未命名").split("：");
            const author = raw.length > 1 ? raw[0] : "";
            const poemTitle = raw.length > 1 ? raw.slice(1).join("：") : raw[0];
            const lines = Array.isArray(item.poem) ? item.poem : [];

            const overlay = document.createElement("div");
            overlay.className = "work-poem";
            overlay.innerHTML = `
                <div class="work-poem-inner">
                    ${item.src ? `<video class="work-poem-video" src="${escapeHtml(item.src)}" poster="${escapeHtml(item.poster || '')}" autoplay loop muted playsinline></video>` : ""}
                    ${author ? `<div class="work-poem-author">${escapeHtml(author)}</div>` : ""}
                    <div class="work-poem-title">${escapeHtml(poemTitle)}</div>
                    ${lines.map(l => `<div class="work-poem-line">${escapeHtml(l)}</div>`).join("")}
                </div>
                <div class="work-lightbox-hint">点击空白处关闭</div>
                <button class="work-lightbox-close" type="button" aria-label="关闭">&times;</button>`;
            document.body.appendChild(overlay);

            // 浮现次序：作者/诗题最先（150ms），诗句按行加速（600ms 起，每行 ×0.8）
            setTimeout(() => {
                overlay.querySelectorAll(".work-poem-author, .work-poem-title")
                    .forEach(el => el.classList.add("show"));
            }, 150);
            overlay.querySelectorAll(".work-poem-line").forEach((el, i) => {
                setTimeout(() => el.classList.add("show"), 600 * Math.pow(0.8, i));
            });

            const close = () => {
                document.removeEventListener("keydown", onKey);
                overlay.remove();
            };
            const onKey = (e) => { if (e.key === "Escape") close(); };
            document.addEventListener("keydown", onKey);
            overlay.addEventListener("click", (e) => {
                if (e.target === overlay) close();
            });
            overlay.querySelector(".work-lightbox-close").addEventListener("click", close);
        }

        _openLightbox(item) {
            // 图集：所有以灯箱查看的图片（视频内联播放、外链跳转、贴纸开诗笺，均不入图集）
            const gallery = (this.worksData || []).filter(it =>
                it.type !== 'video' && it.type !== 'link' && it.type !== 'sticker' && it.type !== 'audio');
            let index = gallery.indexOf(item);

            const overlay = document.createElement("div");
            overlay.className = "work-lightbox";
            overlay.innerHTML = `<img loading="lazy" src="${escapeHtml(item.src || '')}" alt="${escapeHtml(item.title || '')}">
                <div class="work-lightbox-caption">${escapeHtml(item.title || '')}</div>
                <div class="work-lightbox-hint">滚轮切换 · 双击缩放 · Esc 或点空白处关闭</div>
                <button class="work-lightbox-close" type="button" aria-label="关闭">&times;</button>`;
            document.body.appendChild(overlay);

            const img = overlay.querySelector("img");
            const capEl = overlay.querySelector(".work-lightbox-caption");
            let scale = 1, tx = 0, ty = 0;
            const pointers = new Map(); // pointerId -> {x, y}
            let lastDist = 0;

            const clampScale = (s) => Math.min(8, Math.max(1, s));
            const clampPan = () => {
                const mx = (img.clientWidth * (scale - 1)) / 2;
                const my = (img.clientHeight * (scale - 1)) / 2;
                tx = Math.min(mx, Math.max(-mx, tx));
                ty = Math.min(my, Math.max(-my, ty));
            };
            const apply = () => {
                img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
                overlay.classList.toggle("work-lightbox--zoomed", scale > 1);
            };
            // 切换到图集中第 index 张：换图、换标题、复位缩放
            const show = (it) => {
                img.src = it.src || '';
                img.alt = it.title || '';
                capEl.textContent = it.title || '';
                scale = 1; tx = 0; ty = 0;
                apply();
            };
            // 以 (clientX, clientY) 为中心缩放，保持该点下的图像位置不动
            const zoomAt = (clientX, clientY, factor) => {
                const rect = img.getBoundingClientRect();
                tx += (clientX - (rect.left + rect.width / 2)) * (1 - factor);
                ty += (clientY - (rect.top + rect.height / 2)) * (1 - factor);
                scale = clampScale(scale * factor);
                if (scale === 1) { tx = 0; ty = 0; }
                clampPan();
                apply();
            };
            const close = () => {
                document.removeEventListener("keydown", onKey);
                overlay.remove();
            };
            const onKey = (e) => { if (e.key === "Escape") close(); };
            document.addEventListener("keydown", onKey);

            // 滚轮：切换前后一张（带节流，避免一次滚动连翻多张）
            let wheelLock = 0;
            overlay.addEventListener("wheel", (e) => {
                e.preventDefault();
                if (index < 0 || gallery.length < 2) return;
                const now = Date.now();
                if (now - wheelLock < 350) return;
                const next = e.deltaY < 0 ? index - 1 : index + 1;
                if (next < 0 || next >= gallery.length) return;
                wheelLock = now;
                index = next;
                show(gallery[index]);
            }, { passive: false });

            // 双击：放大 2.5x / 还原
            overlay.addEventListener("dblclick", (e) => {
                e.preventDefault();
                if (scale > 1) { scale = 1; tx = 0; ty = 0; apply(); }
                else zoomAt(e.clientX, e.clientY, 2.5);
            });

            // 指针事件：拖拽平移 + 双指捏合缩放
            overlay.addEventListener("pointerdown", (e) => {
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pointers.size === 2) {
                    const [a, b] = [...pointers.values()];
                    lastDist = Math.hypot(a.x - b.x, a.y - b.y);
                }
                // 仅按在图片上时捕获指针；空白处不捕获，
                // 否则 click 的 target 会变成 img，导致「点空白处关闭」失效
                if (e.target === img) img.setPointerCapture(e.pointerId);
            });
            overlay.addEventListener("pointermove", (e) => {
                const prev = pointers.get(e.pointerId);
                if (!prev) return;
                const cur = { x: e.clientX, y: e.clientY };
                pointers.set(e.pointerId, cur);
                if (pointers.size === 2) {
                    const [a, b] = [...pointers.values()];
                    const dist = Math.hypot(a.x - b.x, a.y - b.y);
                    if (lastDist > 0 && dist > 0) {
                        zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, dist / lastDist);
                    }
                    lastDist = dist;
                } else if (scale > 1) {
                    tx += cur.x - prev.x;
                    ty += cur.y - prev.y;
                    clampPan();
                    apply();
                }
            });
            const endPointer = (e) => {
                pointers.delete(e.pointerId);
                lastDist = 0;
            };
            overlay.addEventListener("pointerup", endPointer);
            overlay.addEventListener("pointercancel", endPointer);

            // 关闭：点空白处 / 右上角按钮 / Esc
            overlay.addEventListener("click", (e) => {
                if (e.target === overlay) close();
            });
            overlay.querySelector(".work-lightbox-close").addEventListener("click", close);
        }

        _create() {
            if (!document.querySelector(".neodb-container")) return;

            this._applyToAll(container => {
                container.innerHTML = `
                    <nav class="neodb-nav"></nav>
                    <div class="neodb-list"><div class="neodb-loading">加载中...</div></div>
                    <div class="block-more block-more__centered">
                        <div class="lds-ripple"></div>
                    </div>
                `;
            });
            this._renderTypes();
            this._fetchData();
            this._handleScroll();
        }

        _clearList() {
            this._applyToAll(container => {
                const list = container.querySelector(".neodb-list");
                if (list) list.innerHTML = '<div class="neodb-loading">加载中...</div>';
            });
        }

        _toggleLoading(show) {
            this._queryAll(".lds-ripple").forEach(el => {
                if (show) {
                    el.classList.remove("u-hide");
                } else {
                    el.classList.add("u-hide");
                }
            });
        }

        _isLoadingHidden() {
            const el = this._queryAll(".lds-ripple")[0];
            return el && el.classList.contains("u-hide");
        }
    }

    // Only init once (avoid double init from duplicated page content)
    let _neodbInitialized = false;
    document.addEventListener("DOMContentLoaded", () => {
        if (_neodbInitialized) return;
        _neodbInitialized = true;
        const neodb = new NeoDB({
            container: ".neodb-container",
            baseAPI: "https://x.numb.tech/api",
            types: ["works", "book", "movie", "music", "game", "tv"],
        });
    });
</script>

<script>
(function() {
    // ===== Kindle mode toggle =====
    var kindleToggles = document.querySelectorAll('.kindle-toggle');
    var body = document.body;
    var html = document.documentElement;

    // ===== Mobile scale calculation =====
    function updateKindleScale() {
        var kd = document.querySelector('.kindle-device');
        if (!kd || !body.classList.contains('kindle-mode')) return;
        if (window.innerWidth <= 768) {
            // Wait for browser to render, then measure and scale
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    var availW = window.innerWidth - 16;
                    var availH = window.innerHeight - 16;
                    var natW = kd.scrollWidth;
                    var natH = kd.scrollHeight;
                    if (natW === 0 || natH === 0) return;
                    var scale = Math.min(availW / natW, availH / natH, 1);
                    // Use transform:scale (Safari compatible) + negative margins to reflow
                    kd.style.transform = 'scale(' + scale + ')';
                    kd.style.transformOrigin = 'top center';
                    kd.style.marginLeft = (natW * (scale - 1) / 2) + 'px';
                    kd.style.marginRight = (natW * (scale - 1) / 2) + 'px';
                    kd.style.marginBottom = (natH * (scale - 1)) + 'px';
                });
            });
        } else {
            kd.style.transform = '';
            kd.style.transformOrigin = '';
            kd.style.marginLeft = '';
            kd.style.marginRight = '';
            kd.style.marginBottom = '';
        }
    }

    function applyKindleMode(on, animate) {
        var oc = document.getElementById('original-content');
        var kd = document.querySelector('.kindle-device');
        var boot = document.getElementById('kindle-boot');
        if (on) {
            html.classList.add('kindle-mode');
            body.classList.add('kindle-mode');
            updateKindleScale();
            var prehide = document.getElementById('kindle-prehide');
            if (prehide) prehide.remove();

            if (animate && boot) {
                boot.classList.add('active');
                setTimeout(function() {
                    boot.classList.add('fade-out');
                    setTimeout(function() {
                        boot.classList.remove('active', 'fade-out');
                        var bar = document.getElementById('kindle-boot-bar');
                        if (bar) bar.style.width = '';
                    }, 600);
                }, 2800);
            }
        } else {
            // Phase 1: fade out kindle device
            if (kd) {
                kd.style.transition = 'opacity 0.3s ease';
                kd.style.opacity = '0';
            }
            setTimeout(function() {
                // Phase 2: swap display
                html.classList.remove('kindle-mode');
                body.classList.remove('kindle-mode');
                // Remove pre-hide style so original content is visible
                var prehide = document.getElementById('kindle-prehide');
                if (prehide) prehide.remove();
                if (kd) {
                    kd.style.transition = '';
                    kd.style.opacity = '';
                    kd.style.transform = '';
                    kd.style.transformOrigin = '';
                    kd.style.marginLeft = '';
                    kd.style.marginRight = '';
                    kd.style.marginBottom = '';
                }
                // Phase 3: fade in original content
                if (oc) {
                    oc.classList.add('kindle-entering');
                    setTimeout(function() {
                        oc.classList.remove('kindle-entering');
                    }, 350);
                }
            }, 300);
        }
        kindleToggles.forEach(function(btn) {
            var lbl = btn.querySelector('.kindle-label');
            if (lbl) lbl.textContent = on ? '寫' : '墨';
        });
    }

    var storedKindle = localStorage.getItem('kindle-mode');
    if (storedKindle === 'on') {
        applyKindleMode(true);
    }

    // Recalculate scale on resize
    window.addEventListener('resize', function() {
        if (body.classList.contains('kindle-mode')) updateKindleScale();
    });

    kindleToggles.forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            var isOn = body.classList.contains('kindle-mode');
            applyKindleMode(!isOn, true);
            localStorage.setItem('kindle-mode', !isOn ? 'on' : 'off');
        });
    });

    // ===== Scroll container detection =====
    var screenEl = document.getElementById('kindle-screen');
    // Kindle 屏幕内可能是竖排（横向滚动）或横排特殊页面（纵向滚动）
    function isScreenScroll() {
        if (!body.classList.contains('kindle-mode') || !screenEl) return false;
        var s = window.getComputedStyle(screenEl);
        return s.overflowX === 'auto' || s.overflowY === 'auto';
    }
    function isVerticalMode() {
        var el = isScreenScroll() ? screenEl : body;
        return window.getComputedStyle(el).writingMode.indexOf('vertical') === 0;
    }
    // 竖排页面沿横向滚动（vertical-rl 中 scrollLeft 向负方向增大），取绝对值判断
    function getScrollTop() {
        if (isScreenScroll()) return Math.abs(screenEl.scrollLeft) || screenEl.scrollTop;
        if (isVerticalMode()) return Math.abs(window.scrollX);
        return window.scrollY;
    }
    function scrollToTop(options) {
        var behavior = (options && options.behavior) || 'auto';
        if (isScreenScroll()) { screenEl.scrollTo({ left: 0, top: 0, behavior: behavior }); }
        else if (isVerticalMode()) {
            // vertical-rl 的文档起点在最右侧，即 scrollLeft 为 0
            window.scrollTo({ left: 0, behavior: behavior });
        }
        else { window.scrollTo(options); }
    }
    function onScroll(fn) {
        window.addEventListener('scroll', fn);
        if (screenEl) screenEl.addEventListener('scroll', fn);
    }

    // ===== 竖排模式：滚轮纵向滚动映射为横向滚动（普通页面与 Kindle 屏幕内均适用）=====
    window.addEventListener('wheel', function(e) {
        if (!isVerticalMode()) return;
        // 触控板自带的横向滚动交给浏览器原生处理
        if (Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
        e.preventDefault();
        var dy = e.deltaY;
        if (e.deltaMode === 1) dy *= 40; // 行模式换算为像素
        var target = isScreenScroll() ? screenEl : window;
        target.scrollBy({ left: -dy });
    }, { passive: false });

    // ===== Dark mode toggle =====
    var themeToggles = document.querySelectorAll('.theme-toggle');
    var html = document.documentElement;

    function updateThemeLabels(theme) {
        var text = theme === 'dark' ? '明' : '暗';
        themeToggles.forEach(function(btn) {
            var lbl = btn.querySelector('.theme-label');
            if (lbl) lbl.textContent = text;
        });
    }

    var stored = localStorage.getItem('theme');
    var currentTheme = null;

    if (stored === 'dark' || stored === 'light') {
        html.setAttribute('data-theme', stored);
        currentTheme = stored;
    } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        html.setAttribute('data-theme', 'dark');
        currentTheme = 'dark';
    }

    updateThemeLabels(currentTheme || 'light');

    themeToggles.forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            var current = html.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeLabels(next);
        });
    });

    // ===== 横竖排一键切换 =====
    var orientToggles = document.querySelectorAll('.orient-toggle');
    function applyOrientation(horizontal) {
        if (horizontal) {
            html.classList.add('horizontal-mode');
            localStorage.setItem('orientation', 'h');
        } else {
            html.classList.remove('horizontal-mode');
            localStorage.setItem('orientation', 'v');
        }
        orientToggles.forEach(function(btn) {
            var lbl = btn.querySelector('.orient-label');
            if (lbl) lbl.textContent = horizontal ? '竖' : '横';
        });
    }
    applyOrientation(localStorage.getItem('orientation') === 'h');
    orientToggles.forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            applyOrientation(!html.classList.contains('horizontal-mode'));
            // 切换后回到文首，避免滚动位置停留在另一排版不可达的位置
            window.scrollTo({ left: 0, top: 0 });
        });
    });

    // ===== Back to top =====
    var backTop = document.getElementById('back-top');
    if (backTop) {
        onScroll(function() {
            if (getScrollTop() > 400) {
                backTop.classList.add('show');
            } else {
                backTop.classList.remove('show');
            }
        });
        backTop.addEventListener('click', function(e) {
            e.preventDefault();
            scrollToTop({ top: 0, behavior: 'smooth' });
        });
    }

    // ===== Year jump =====
    var yearJump = document.getElementById('year-jump');
    var yearJumpPanel = document.getElementById('year-jump-panel');
    var yearElements = document.querySelectorAll('.archive .year');

    if (yearJump && yearJumpPanel && yearElements.length > 1) {
        yearJump.classList.add('active');

        yearElements.forEach(function(el) {
            var a = document.createElement('a');
            a.href = '#' + el.id;
            a.textContent = el.textContent;
            a.addEventListener('click', function(e) {
                e.preventDefault();
                if (isScreenScroll()) {
                    screenEl.querySelector('#' + el.id).scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
                yearJumpPanel.classList.remove('show');
            });
            yearJumpPanel.appendChild(a);
        });

        yearJump.addEventListener('click', function(e) {
            e.preventDefault();
            yearJumpPanel.classList.toggle('show');
        });

        document.addEventListener('click', function(e) {
            if (!yearJump.contains(e.target) && !yearJumpPanel.contains(e.target)) {
                yearJumpPanel.classList.remove('show');
            }
        });
    }

    // ===== 竖排西文/数字直立（浏览器端注入，覆盖正文、标题、列表，不依赖构建期处理）=====
    function verticalizeText(root) {
        var SKIP = { PRE: 1, CODE: 1, STYLE: 1, SCRIPT: 1, TEXTAREA: 1 };
        // 实体原样跳过；数字（含千分位逗号、小数、%）→ .tcy；英文单词 → .v-en；
        // 单词/数字后紧跟的半角标点随同嵌入，避免「单词横排、逗号竖躺」的割裂感
        var RE = /&(?:#[0-9]+|#x[0-9a-fA-F]+|[a-zA-Z][a-zA-Z0-9]*);|\b(\d{1,4}(?:,\d{3})*(?:\.\d{1,3})?%?)([,.;:!?"'“”‘’…]*)|\b([A-Za-z][A-Za-z0-9]*(?:[-'&][A-Za-z0-9]*)*)([,.;:!?"'“”‘’…]*)|&/g;
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
            acceptNode: function (n) {
                // 注意 & 也可能单独成节点（两侧单词已被包进 span），不能只认字母数字
                if (!n.nodeValue || !/[A-Za-z0-9&]/.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
                var p = n.parentNode;
                while (p && p !== root) {
                    if (SKIP[p.nodeName]) return NodeFilter.FILTER_REJECT;
                    if (p.classList && (p.classList.contains('tcy') || p.classList.contains('v-en'))) return NodeFilter.FILTER_REJECT;
                    p = p.parentNode;
                }
                return NodeFilter.FILTER_ACCEPT;
            }
        });
        var nodes = [], n;
        while ((n = walker.nextNode())) {
            // 归档页的年份标题（.year）不做纵中横排压缩，改走水平嵌入
            var p = n.parentNode, inYear = false;
            while (p && p !== root) {
                if (p.classList && p.classList.contains('year')) { inYear = true; break; }
                p = p.parentNode;
            }
            nodes.push({ node: n, year: inYear });
        }
        nodes.forEach(function (item) {
            var node = item.node;
            var text = node.nodeValue, m, last = 0, frag = document.createDocumentFragment(), hit = false;
            while ((m = RE.exec(text))) {
                if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
                var isNum = m[1] !== undefined;
                var s = document.createElement('span');
                // 年份标题：每位数字直立竖排、不压缩；其余数字：纵中横排
                s.className = isNum ? (item.year ? 'v-num' : 'tcy') : 'v-en';
                // & 分支没有捕获组，直接用原始匹配文本，避免出现 "undefined"
                s.textContent = isNum ? m[1] + (m[2] || '') : (m[3] !== undefined ? m[3] + (m[4] || '') : m[0]);
                frag.appendChild(s);
                last = m.index + m[0].length;
                hit = true;
            }
            if (!hit) return;
            if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
            node.parentNode.replaceChild(frag, node);
        });
    }
    document.querySelectorAll('.main').forEach(verticalizeText);

    // 动态插入的内容（如 X 页 NeoDB 列表）渲染后自动补处理；自身无新增匹配时不会循环
    var vTimer = null;
    var vObserver = new MutationObserver(function () {
        clearTimeout(vTimer);
        vTimer = setTimeout(function () {
            document.querySelectorAll('.main').forEach(verticalizeText);
        }, 120);
    });
    vObserver.observe(document.body, { childList: true, subtree: true });

    // ===== Kindle page turn buttons =====
    var prevBtn = document.getElementById('kindle-prev');
    var nextBtn = document.getElementById('kindle-next');
    function handlePageTurn(direction) {
        if (!isScreenScroll()) return;
        if (isVerticalMode()) {
            // 竖排：下一页沿阅读方向向左，上一页向右
            var pageWidth = screenEl.clientWidth;
            screenEl.scrollBy({
                left: direction === 'next' ? -pageWidth : pageWidth,
                behavior: 'smooth'
            });
        } else {
            var pageHeight = screenEl.clientHeight;
            screenEl.scrollBy({
                top: direction === 'next' ? pageHeight : -pageHeight,
                behavior: 'smooth'
            });
        }
    }
    if (prevBtn) prevBtn.addEventListener('click', function() { handlePageTurn('prev'); });
    if (nextBtn) nextBtn.addEventListener('click', function() { handlePageTurn('next'); });

    // ===== Kindle home button (back to top) =====
    var kindleHomeBtn = document.getElementById('kindle-home-btn');
    if (kindleHomeBtn) {
        kindleHomeBtn.addEventListener('click', function() {
            scrollToTop({ top: 0, behavior: 'smooth' });
        });
    }

    // ===== Kindle status bar clock =====
    var kindleTimeEls = document.querySelectorAll('#kindle-time');
    function updateKindleTime() {
        var now = new Date();
        var h = now.getHours();
        var ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        var m = String(now.getMinutes()).padStart(2, '0');
        var text = h + ':' + m + ' ' + ampm;
        kindleTimeEls.forEach(function(el) { el.textContent = text; });
    }
    if (kindleTimeEls.length) {
        updateKindleTime();
        setInterval(updateKindleTime, 30000);
    }

    // ===== Read count =====
    var readBtns = document.querySelectorAll('#read-btn');
    var readCountEls = document.querySelectorAll('#read-count');
    if (readBtns.length && readCountEls.length) {
        var counterUrl = 'https://counter.numb.tech';
        var slug = readBtns[0].getAttribute('data-slug');
        var storageKey = 'read_' + slug;
        var hasRead = localStorage.getItem(storageKey);

        if (counterUrl && slug) {
            fetch(counterUrl + '?slug=' + encodeURIComponent(slug))
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (d.count !== undefined) {
                        readCountEls.forEach(function(el) { el.textContent = d.count; });
                    }
                })
                .catch(function() {});

            if (hasRead) {
                readBtns.forEach(function(btn) { btn.classList.add('read-done'); });
            }

            readBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    if (hasRead) return;
                    hasRead = '1';
                    localStorage.setItem(storageKey, '1');
                    readBtns.forEach(function(b) { b.classList.add('read-done'); });

                    var fly = document.createElement('span');
                    fly.className = 'read-fly';
                    fly.textContent = '+1';
                    btn.parentNode.appendChild(fly);
                    setTimeout(function() { fly.remove(); }, 900);

                    fetch(counterUrl + '?slug=' + encodeURIComponent(slug), { method: 'POST' })
                        .then(function(r) { return r.json(); })
                        .then(function(d) {
                            if (d.count !== undefined) {
                                readCountEls.forEach(function(el) { el.textContent = d.count; });
                            }
                            if (d.duplicate) {
                                hasRead = null;
                                localStorage.removeItem(storageKey);
                                readBtns.forEach(function(b) { b.classList.remove('read-done'); });
                            }
                        })
                        .catch(function() {});
                });
            });
        }
    }

})();
</script>
